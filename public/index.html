<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Android APK Builder Studio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="workspace">
    <!-- Sidebar -->
    <div class="sidebar">
        <div class="logo">
            <h2>APK BUILDER STUDIO</h2>
        </div>

        <div class="section">
            <h3>Projects</h3>
            <div id="projectList" class="project-list"></div>
            <button class="btn btn-primary" onclick="showCreateProject()">+ New Project</button>
        </div>

        <div class="section">
            <h3>Actions</h3>
            <button class="btn btn-build" id="buildBtn" onclick="buildProject()" disabled>🔨 Build APK</button>
            <button class="btn btn-download" id="downloadBtn" onclick="downloadAPK()" disabled>⬇️ Download APK</button>
        </div>
    </div>

    <!-- Main editor area -->
    <div class="editor-area">
        <!-- Top toolbar -->
        <div class="toolbar">
            <span id="currentFile">No file selected</span>
            <div class="toolbar-actions">
                <button onclick="saveCurrentFile()" class="btn btn-small">💾 Save</button>
                <button onclick="newFile()" class="btn btn-small">📄 New File</button>
            </div>
        </div>

        <div class="editor-container">
            <!-- File tree -->
            <div class="file-tree">
                <h4>Project Structure</h4>
                <div id="fileTree" class="tree"></div>
            </div>

            <!-- Code editor -->
            <div class="code-editor">
                <textarea id="codeEditor" placeholder="Select a file to edit..."></textarea>
            </div>
        </div>
    </div>

    <!-- Build console -->
    <div class="console">
        <div class="console-header">Build Console</div>
        <div id="console" class="console-output"></div>
    </div>
</div>

<!-- Modal for new project -->
<div id="createProjectModal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeModal('createProjectModal')">&times;</span>
        <h2>Create New Project</h2>
        <form onsubmit="createProject(event)">
            <input type="text" id="projectNameInput" placeholder="Project Name" required />
            <input type="text" id="packageNameInput" placeholder="Package Name (com.example.app)" required />
            <input type="text" id="appNameInput" placeholder="App Name" required />
            <input type="number" id="minSdkInput" placeholder="Min SDK" value="21" />
            <input type="number" id="targetSdkInput" placeholder="Target SDK" value="33" />
            <button type="submit" class="btn btn-primary">Create</button>
        </form>
    </div>
</div>

<!-- Modal for new file -->
<div id="newFileModal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeModal('newFileModal')">&times;</span>
        <h2>Create New File</h2>
        <form onsubmit="createNewFile(event)">
            <input type="text" id="newFilePathInput" placeholder="File path (e.g., app/src/main/java/com/example/MainActivity.java)" required />
            <button type="submit" class="btn btn-primary">Create</button>
        </form>
    </div>
</div>

<script src="app.js"></script>

</body>
</html>
